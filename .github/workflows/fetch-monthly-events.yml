name: Fetch monthly Whitby events

on:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  fetch-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Fetch Whitby festivals and regattas
        run: npm run events:fetch

      - name: Commit updated events data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/events.json

          if git diff --staged --quiet; then
            echo "No changes in data/events.json"
            exit 0
          fi

          git commit -m "chore: refresh Whitby events calendar"
          git push origin main
